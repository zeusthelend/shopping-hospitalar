name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/dav-sales-analytics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
